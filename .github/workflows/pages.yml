name: Deploy site to GitHub Pages

# Thin caller — delegates to the reusable engine workflow.
# Enable once under Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      vault-dir: notes
      base-path: /nonnative
    permissions:
      contents: read
      pages: write
      id-token: write
